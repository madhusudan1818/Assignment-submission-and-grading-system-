<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Assignment Portal</h1></header>
  <main>
    <div class="card">
      <h2 id="title">Log in</h2>
      <div id="extra" style="display:none">
        <label for="name">Full name</label><input id="name">
        <label for="role">I am a</label>
        <select id="role"><option value="student">Student</option><option value="teacher">Teacher</option></select>
        <div id="codeBox" style="display:none"><label for="code">Teacher code</label><input id="code" type="password"></div>
      </div>
      <label for="email">Email</label><input id="email" type="email">
      <label for="password">Password</label><input id="password" type="password">
      <div class="msg" id="msg"></div>
      <button id="submit">Log in</button>
      <p><button class="link" id="toggle">New here? Create an account</button></p>
    </div>
  </main>
  <script src="app.js"></script>
  <script>initLogin();</script>
</body>
</html>
